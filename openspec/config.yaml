schema: spec-driven

context: |
  Zero is a Tauri 2 / Rust 2021 / React 19 / TypeScript desktop toolbox.
  Read AGENTS.md, openspec/project.md, and docs/project-overview.md before creating artifacts.
  Bundled plugins: zero.snap, zero.awake, zero.paper, zero.launch, zero.file.
  Keep host core independent of concrete plugins and keep Rust/TypeScript IPC contracts symmetric.
  Inspect overlapping active changes; distinguish source implementation, automated checks, and device/release evidence.
  Preserve com.watson.ztool for upgrade compatibility and never approve File engine packages without release evidence.
