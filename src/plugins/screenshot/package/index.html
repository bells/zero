<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Snap</title></head>
<body>
  <main id="snap">
    <header>
      <button type="button" id="capture" class="primary" disabled>Capture main display</button>
      <div id="history" class="controls" hidden>
        <button type="button" id="undo" disabled>Undo</button>
        <button type="button" id="redo" disabled>Redo</button>
        <button type="button" id="reset-crop" disabled>Clear crop</button>
      </div>
    </header>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="editor" hidden>
      <div id="editing" class="edit-bar">
        <div id="tools" class="controls" role="group" aria-label="Editing tools">
          <button type="button" data-tool="crop" aria-pressed="true">Crop</button>
          <button type="button" data-tool="move" aria-pressed="false">Move</button>
          <button type="button" data-tool="rectangle" aria-pressed="false">Rectangle</button>
          <button type="button" data-tool="ellipse" aria-pressed="false">Ellipse</button>
          <button type="button" data-tool="arrow" aria-pressed="false">Arrow</button>
          <button type="button" data-tool="pen" aria-pressed="false">Pen</button>
          <button type="button" data-tool="text" aria-pressed="false">Text</button>
          <button type="button" data-tool="mosaic" aria-pressed="false">Mosaic</button>
        </div>
        <div class="style-controls">
          <label><span id="color-label">Color</span><input type="color" id="color" value="#ef565d"></label>
          <label><span id="stroke-label">Line width</span><input type="range" id="stroke" min="2" max="24" value="6"></label>
          <input type="text" id="text-value" maxlength="120" placeholder="Type annotation text" aria-label="Annotation text" hidden>
        </div>
      </div>
      <div class="preview">
        <canvas id="canvas" width="1" height="1" aria-label="Captured screenshot"></canvas>
      </div>
      <footer class="controls">
        <button type="button" id="copy">Copy image</button>
        <button type="button" id="save">Save PNG</button>
        <button type="button" id="pin" aria-pressed="false">Keep on top</button>
      </footer>
    </section>
  </main>
  <script type="module" src="./entry.ts"></script>
</body>
</html>
