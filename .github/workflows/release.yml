name: Package Zero

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      profile:
        description: "Packages to build"
        type: choice
        options: [both, core, standard]
        default: both

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.profile }} / ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'push' && '["core","standard"]' || inputs.profile == 'both' && '["core","standard"]' || format('["{0}"]', inputs.profile)) }}
        target: [aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc]
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: package-${{ matrix.profile }}-${{ matrix.target }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check version
        id: version
        run: node scripts/verify-package-version.mjs
      - name: Verify profile registry behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features ${{ matrix.profile == 'standard' && '--features bundled-tools' || '' }} --test build_profiles
      - name: Build installers and measure sizes
        run: pnpm package:desktop --profile ${{ matrix.profile }} --target ${{ matrix.target }} --ci
      - name: Verify tool exclusion in frontend bundle
        run: node scripts/verify-build-profile.mjs ${{ matrix.profile }}
      - name: Upload downloadable installers
        uses: actions/upload-artifact@v4
        with:
          name: Zero-v${{ steps.version.outputs.version }}-${{ matrix.profile }}-${{ matrix.target }}
          path: build/packages/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Attach installers to draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: build/downloads
      - name: Collect installers, measurements and checksums
        run: node scripts/collect-release-assets.mjs
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-draft-release.mjs
