name: Website checks

on:
  pull_request:
    paths: ['website/**', '.github/workflows/website-check.yml', 'docs/website.md', 'src/assets/icons/zero*.svg']
  push:
    branches: [main, master]
    paths: ['website/**', '.github/workflows/website-check.yml', 'docs/website.md', 'src/assets/icons/zero*.svg']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Includes web-tool domain/worker contracts; browser suite also covers the tools.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:seo
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-evidence
          path: |
            website/output/browser-results.json
            website/output/screenshots/
            website/test-results/
          retention-days: 7
